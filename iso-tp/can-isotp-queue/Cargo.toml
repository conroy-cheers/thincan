[package]
name = "can-isotp-queue"
version = "0.1.0"
edition = "2024"
description = "Queue/actor adapter for split ISO-TP TX/RX endpoints across async runtimes"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/can-isotp-queue"
readme = "README.md"

[features]
default = []
tokio = ["dep:tokio"]
embassy-07 = ["dep:embassy-sync-07", "dep:embassy-time", "dep:embassy-futures"]

[dependencies]
can-isotp-interface = "0.1.0"
tokio = { version = "1", optional = true, features = ["rt", "sync", "time"] }
embassy-sync-07 = { package = "embassy-sync", version = "0.7.2", default-features = false, optional = true }
embassy-time = { version = "0.5.0", default-features = false, optional = true }
embassy-futures = { version = "0.1.2", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
