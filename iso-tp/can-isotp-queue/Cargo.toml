[package]
name = "can-isotp-queue"
version = "0.3.0"
edition = "2024"
rust-version.workspace = true
description = "Queue/actor adapter for split ISO-TP TX/RX endpoints across async runtimes"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/can-isotp-queue"
readme = "README.md"

[features]
default = []
tokio = ["dep:tokio", "can-isotp-interface/tokio"]
embassy = ["can-isotp-interface/embassy", "dep:embassy-sync", "dep:embassy-futures"]

[dependencies]
can-isotp-interface = "0.2.0"
tokio = { version = "1", optional = true, features = ["macros", "rt", "sync", "time"] }
embassy-sync = { version = "0.8.0", default-features = false, optional = true }
embassy-futures = { version = "0.1.2", default-features = false, optional = true }

[dev-dependencies]
can-isotp-interface = { version = "0.2.0", features = ["tokio"] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
  "test-util",
] }

[package.metadata.docs.rs]
all-features = true
