[package]
name = "linux-socketcan-iso-tp"
version = "0.2.0"
edition = "2024"
keywords = ["can", "iso-tp", "socketcan"]
documentation = "https://docs.rs/linux-socketcan-iso-tp"
description = "Linux kernel ISO-TP socket backend implementing can-isotp-interface"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[features]
default = []
tokio = ["dep:tokio", "can-isotp-interface/tokio"]

[dependencies]
can-isotp-interface = "0.2.0"
can-uds = "0.1.0"
embedded-can = "0.4.1"
tokio = { version = "1", optional = true, features = [
  "macros",
  "sync",
  "io-util",
  "net",
  "time",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
socket2 = "0.5.10"
socketcan = "3.5.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time", "test-util"] }
