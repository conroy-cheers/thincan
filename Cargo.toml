[workspace]
resolver = "3"
members = [
  "iso-tp/can-isotp-queue",
  "embedded-can/embedded-can-embassy-stm32",
  "embedded-can/embedded-can-socketcan",
  "embedded-can/embedded-can-unix-socket",
  "iso-tp/linux-socketcan-iso-tp",
  "thincan",
  "examples/thincan-example",
  "thincan-file-transfer",
  "compat-tests",
]

[workspace.package]
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/conroy-cheers/thincan"
homepage = "https://github.com/conroy-cheers/thincan"

# `can-iso-tp` from crates.io depends on `can-isotp-queue`. Use this workspace's
# copy so its types match the ones the example and compat tests pass in.
[patch.crates-io]
can-isotp-queue = { path = "iso-tp/can-isotp-queue" }
