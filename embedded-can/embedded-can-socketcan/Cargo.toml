[package]
name = "embedded-can-socketcan"
version = "0.1.2"
edition = "2024"
keywords = ["io", "can", "socketcan", "linux"]
description = "Linux SocketCAN adapters implementing embedded-can-interface traits"
documentation = "https://docs.rs/embedded-can-socketcan"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
embedded-can-interface = "0.1.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
socketcan = { version = "3.5.0", default-features = false }

[features]
default = []
tokio = ["socketcan/tokio"]
