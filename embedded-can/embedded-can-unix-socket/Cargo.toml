[package]
name = "embedded-can-unix-socket"
version = "0.1.1"
edition = "2024"
description = "Unix-domain-socket CAN bus simulator implementing embedded-can-interface traits"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/embedded-can-unix-socket"
readme = "README.md"

[dependencies]
embedded-can = "0.4.1"
embedded-can-interface = "0.1.1"
libc = "0.2"

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3"

[[bench]]
name = "throughput"
harness = false
