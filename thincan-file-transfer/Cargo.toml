[package]
name = "thincan-file-transfer"
version = "0.2.0"
edition = "2024"
rust-version.workspace = true
description = "Reusable file-transfer bundle and codecs for thincan transports"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/thincan-file-transfer"
readme = "README.md"

[features]
default = ["std"]
alloc = []
std = ["alloc", "thincan/std"]
heapless = ["dep:heapless"]
tokio = ["can-isotp-interface/tokio", "std", "dep:embassy-sync", "dep:embassy-futures"]
embassy = ["can-isotp-interface/embassy", "heapless", "dep:embassy-sync", "dep:embassy-futures"]

[dependencies]
capnp = { version = "0.25.0", default-features = false, features = [
    "unaligned",
] }
can-isotp-interface = "0.2.0"
embassy-futures = { version = "0.1.2", optional = true }
embassy-sync = { version = "0.8.0", optional = true }
heapless = { version = "0.9.2", default-features = false, optional = true }
sha2 = { version = "0.10", default-features = false }
thincan = { path = "../thincan", version = "0.2.0", default-features = false, features = [
    "capnp",
] }

[build-dependencies]
capnpc = "0.25.0"

[lib]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "test-util"] }

[package.metadata.docs.rs]
all-features = true
