[package]
name = "thincan"
version = "0.1.1"
edition = "2024"
description = "Thin, composable application-layer message routing for UDS-style ISO-TP transports"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/thincan"
readme = "README.md"

[dependencies]
capnp = { version = "0.25.0", default-features = false, features = [
    "unaligned",
], optional = true }
capnpc = { version = "0.25.0", optional = true }
embedded-can = "0.4.1"
embedded-can-interface = "0.1.1"
phf = { version = "0.13.1", default-features = false, features = ["macros"] }
can-iso-tp = { version = "0.2.0", default-features = false, features = [
    "isotp-interface",
    "uds",
] }
can-isotp-interface = "0.1.0"
embassy-sync = { version = "0.8.0", default-features = false }

[features]
default = ["std", "capnp"]
capnp = ["dep:capnp"]
capnp-gen = ["std", "dep:capnpc"]
std = []
async = []

[dev-dependencies]
embedded-can-mock = "0.1.0"
tokio = { version = "1.49.0", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "sync",
] }

[[bin]]
name = "gen_test_capnp"
path = "src/bin/gen_test_capnp.rs"
required-features = ["capnp-gen"]
